<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📖 Quiz 3 - Cloud Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #f5f2eb; --card-bg: #ffffff; --text-color: #2c3e50;
      --question-bg: #ffffff; --border-color: #e0dcd0; --btn-bg: #faf9f6; 
      --primary-color: #5d6d7e; --progress-color: #27ae60;
    }
    [data-theme="dark"] {
      --bg-color: #1a1a1a; --card-bg: #2d2d2d; --text-color: #e0e0e0;
      --question-bg: #3d3d3d; --border-color: #444; --btn-bg: #3a3a3a;
      --primary-color: #8da2b5;
    }
    body { font-family: 'Rubik', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; transition: 0.3s; }
    
    /* Login Section Styling */
    .auth-bar { background: var(--card-bg); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-color); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-pic { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--primary-color); }
    .login-btn { background: #fff; color: #444; border: 1px solid #ddd; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; }

    .container { max-width: 700px; margin: auto; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; border: 1px solid var(--border-color); }
    .progress-container { width: 100%; background: #e0dcd0; height: 8px; border-radius: 5px; margin-bottom: 15px; display: none; }
    #progressBar { height: 100%; width: 0%; background: var(--progress-color); border-radius: 5px; transition: 0.4s; }
    .header-btns { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    #themeBtn, #quitBtn, #bookmarkActionBtn, #heartActionBtn { padding: 8px 12px; font-size: 13px; background: var(--primary-color); color: white; border: none; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    #quitBtn { background: #e74c3c; display: none; }
    #bookmarkActionBtn, #heartActionBtn { background: transparent; font-size: 20px; padding: 0; display: none; }
    #bookmarkActionBtn svg, #heartActionBtn svg { width: 28px; height: 28px; fill: none; stroke: var(--text-color); stroke-width: 2; }
    #bookmarkActionBtn.active svg { fill: var(--text-color); }
    #heartActionBtn.active svg { fill: #e74c3c; stroke: #e74c3c; }
    .voice-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .voice-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--progress-color); }
    input:checked + .slider:before { transform: translateX(16px); }
    #timerDisplay { font-weight: bold; font-size: 18px; color: #e74c3c; display: none; text-align: center; flex-grow: 1; }
    h2 { text-align: center; margin-top: 0; color: var(--primary-color); }
    select, input, .main-btn { padding: 12px; font-size: 16px; margin-bottom: 12px; width: 100%; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--btn-bg); color: var(--text-color); box-sizing: border-box; }
    .challenge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .challenge-grid label { font-size: 13px; font-weight: bold; margin-bottom: 5px; display: block; }
    .question-card { background: var(--question-bg); border-left: 6px solid var(--primary-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; font-size: 24px; font-weight: 550; line-height: 1.5; position: relative; }
    .speak-btn { position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer; font-size: 20px; opacity: 0.6; }
    .option-btn { display: block; background: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-color); padding: 14px; margin: 10px 0; border-radius: 10px; cursor: pointer; width: 100%; text-align: left; font-size: 19px; font-weight: 500; }
    #nextBtn { display: none; background: #28a745 !important; color: white !important; border: none; text-align: center; margin-top: 15px; width: 100%; padding: 14px; border-radius: 10px; font-size: 18px; cursor: pointer; }
    .explanation-box { display: none; background: #eef2f7; border-left: 5px solid #3498db; padding: 15px; margin-top: 15px; border-radius: 8px; font-size: 16px; }
    .tracker-card, .collection-card { display: none; margin-top: 10px; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; background: var(--card-bg); }
    .subject-group { margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
    .subject-title { background: var(--primary-color); color: white; padding: 10px; font-weight: bold; }
    .chapter-row { display: flex; justify-content: space-between; padding: 10px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); align-items: center; }
  </style>
</head>
<body>

  <div class="auth-bar">
    <div id="userInfo" class="user-info">
        <span id="syncStatus" style="font-size: 11px; color: #888;">Log in to sync ☁️</span>
    </div>
    <button id="loginBtn" class="login-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="16"> Gmail Login
    </button>
    <div id="userProfile" style="display:none; align-items:center; gap:10px;">
        <img id="userPic" class="user-pic">
        <button onclick="googleLogout()" style="background:none; border:none; color:red; font-size:11px; cursor:pointer;">Logout</button>
    </div>
  </div>

  <div class="header-btns">
    <div class="header-left" style="display:flex; align-items:center; gap:8px;">
      <button id="themeBtn" onclick="toggleTheme()">🌙</button>
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:12px;">🔊</span>
        <label class="voice-switch">
          <input type="checkbox" id="autoReadSwitch">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div id="timerDisplay">⏳ 00:00</div>
    <div style="display: flex; gap: 10px;">
      <button id="heartActionBtn" title="Subject-wise Collection" onclick="handleHeartClick()"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg></button>
      <button id="bookmarkActionBtn" onclick="handleBookmarkClick()"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>
    </div>
    <button id="quitBtn" onclick="quitQuiz()">⏹️ Quit</button>
  </div>

  <div class="container">
    <div class="progress-container" id="pCont"><div id="progressBar"></div></div>

    <div id="setupArea">
        <h2>🔥 Smart Quiz Cloud</h2>
        
        <button id="resumeBtn" class="main-btn" style="background: #9b59b6; color: white; display: none;" onclick="resumeQuiz()">🕒 पिछala क्विज़ जारी रखें</button>

        <select id="subjectSelect" onchange="updateChapters()"><option value="all">-- सभी विषय --</option></select>
        <select id="chapterSelect"><option value="all">-- सभी अध्याय --</option></select>
        <div class="challenge-grid">
          <div><label>सवाल:</label><input type="number" id="customLimit" placeholder="10"></div>
          <div><label>मिनट:</label><input type="number" id="customTime" placeholder="5"></div>
        </div>
        
        <button class="main-btn" onclick="startQuiz()" style="background: #5d6d7e; color: white;">🎯 क्विज़ शुरू करें</button>
        <button id="weakAreasBtn" class="main-btn" style="background: #e67e22; color: white; display: none;" onclick="startWeakAreasQuiz()">🔄 Improve Weak Areas (<span id="weakCount">0</span>)</button>
        <button id="collectionMainBtn" class="main-btn" style="background: #e74c3c; color: white; display: none;" onclick="toggleCollection()">❤️ My Collections</button>
        <button class="main-btn" onclick="toggleTracker()" style="background: #3498db; color: white;">📊 Revision Tracker</button>
        <button id="savedPracticeBtn" class="main-btn" style="background:#f1c40f; color:#000; display:none;" onclick="startSavedPractice()">⭐ सहेजे गए सवाल</button>

        <div id="trackerArea" class="tracker-card">
          <h3 style="text-align:center;">📅 रिवीजन स्टेटस</h3>
          <div id="trackerContent"></div>
        </div>

        <div id="collectionArea" class="collection-card">
          <h3 style="text-align:center;">❤️ Collection Practice</h3>
          <select id="collSubFilter" onchange="updateCollChapters()"><option value="all">-- विषय चुनें --</option></select>
          <select id="collChFilter"><option value="all">-- अध्याय चुनें --</option></select>
          <button class="main-btn" onclick="startCollectionPractice()" style="background: #27ae60; color: white; margin-top: 10px;">🚀 Practice Start</button>
        </div>
    </div>
    <div id="quizArea" style="display:none;"></div>
  </div>

  <script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyDjHFP6SETiC9Uuut5wN6nOpDA5vqDVwkw",
      authDomain: "mystudyquiz-ac0d9.firebaseapp.com",
      databaseURL: "https://mystudyquiz-ac0d9-default-rtdb.firebaseio.com",
      projectId: "mystudyquiz-ac0d9",
      storageBucket: "mystudyquiz-ac0d9.firebasestorage.app",
      messagingSenderId: "258779460797",
      appId: "1:258779460797:web:2201be41a252ce0e5333d4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUser = null;

    let quizData = {}, selectedQuestions = [], wrongQuestions = [], currentIdx = 0, score = 0, timerInterval;
    let questionsAttempted = 0, currentSub = "", currentCh = "", isWeakMode = false;
    let savedList = JSON.parse(localStorage.getItem("quiz_bookmarks")) || [];
    let revisionDates = JSON.parse(localStorage.getItem("revision_dates")) || {};
    let weakList = JSON.parse(localStorage.getItem("weak_questions")) || [];
    let collections = JSON.parse(localStorage.getItem("quiz_collections")) || {};

    // --- AUTH LOGIC ---
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("userProfile").style.display = "flex";
        document.getElementById("userPic").src = user.photoURL;
        document.getElementById("syncStatus").innerText = "☁️ Synced as " + user.displayName;
        loadCloudData();
      }
    });

    function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert("Login Error: " + e.message));
    }

    function googleLogout() { auth.signOut().then(() => location.reload()); }

    // --- CLOUD SYNC LOGIC ---
    function syncAll() {
      if (!currentUser) return;
      db.ref('users/' + currentUser.uid).set({
        bookmarks: savedList,
        weak: weakList,
        collections: collections,
        revision: revisionDates
      });
      document.getElementById("syncStatus").innerText = "☁️ All Data Synced";
    }

    function loadCloudData() {
      db.ref('users/' + currentUser.uid).once('value').then(snap => {
        const cloud = snap.val();
        if (cloud) {
          if (cloud.bookmarks) { savedList = cloud.bookmarks; localStorage.setItem("quiz_bookmarks", JSON.stringify(savedList)); }
          if (cloud.weak) { weakList = cloud.weak; localStorage.setItem("weak_questions", JSON.stringify(weakList)); }
          if (cloud.collections) { collections = cloud.collections; localStorage.setItem("quiz_collections", JSON.stringify(collections)); }
          if (cloud.revision) { revisionDates = cloud.revision; localStorage.setItem("revision_dates", JSON.stringify(revisionDates)); }
          refreshUI();
        }
      });
    }

    function refreshUI() {
        checkSavedBtn(); updateWeakBtn(); updateCollectionBtn(); checkResumeStatus();
    }

    window.onload = () => { refreshUI(); };

    // --- QUIZ LOGIC (Rest of your original code with minor sync hooks) ---
    fetch("Quiz3.json?v=" + Math.random()).then(r => r.json()).then(j => {
      quizData = j;
      const s = document.getElementById("subjectSelect");
      Object.keys(j).forEach(k => s.add(new Option(k, k)));
    });

    function updateChapters() {
      const s = document.getElementById("subjectSelect").value, c = document.getElementById("chapterSelect");
      c.innerHTML = "<option value='all'>-- सभी अध्याय --</option>";
      if(s !== "all" && quizData[s]) Object.keys(quizData[s]).forEach(k => c.add(new Option(k, k)));
    }

    function startQuiz() {
      clearSession(); isWeakMode = false;
      currentSub = document.getElementById("subjectSelect").value;
      currentCh = document.getElementById("chapterSelect").value;
      let allTempQ = [];
      if (currentSub === "all") {
        Object.keys(quizData).forEach(s => Object.keys(quizData[s]).forEach(c => allTempQ = allTempQ.concat(quizData[s][c])));
      } else if (currentCh === "all") {
        Object.keys(quizData[currentSub]).forEach(c => allTempQ = allTempQ.concat(quizData[currentSub][c]));
      } else { allTempQ = [...quizData[currentSub][currentCh]]; }

      if(allTempQ.length === 0) return alert("सवाल नहीं मिले!");
      const limit = parseInt(document.getElementById("customLimit").value);
      selectedQuestions = (limit > 0) ? allTempQ.sort(() => Math.random() - 0.5).slice(0, limit) : allTempQ.sort(() => Math.random() - 0.5);
      
      const mins = parseInt(document.getElementById("customTime").value);
      if(mins > 0) startTimer(mins);
      initQuizUI();
    }

    function initQuizUI() {
      currentIdx = score = questionsAttempted = 0; wrongQuestions = [];
      document.getElementById("setupArea").style.display = "none";
      document.getElementById("pCont").style.display = "block";
      document.getElementById("quizArea").style.display = "block";
      document.getElementById("quitBtn").style.display = "block";
      document.getElementById("bookmarkActionBtn").style.display = "flex";
      document.getElementById("heartActionBtn").style.display = "flex";
      renderLayout(); showQuestion();
    }

    function renderLayout() {
      document.getElementById("quizArea").innerHTML = `
        <div id="qCount" style="text-align:right; font-size:14px; font-weight:bold; margin-bottom:5px;"></div>
        <div id="questionBox" class="question-card"></div>
        <div id="optionsBox"></div>
        <div id="resultBox" style="text-align:center; font-weight:bold; margin-top:10px;"></div>
        <button id="nextBtn" onclick="nextQuestionTrigger()">➡️ अगला सवाल</button>
        <div id="explanationBox" class="explanation-box"></div>`;
    }

    function showQuestion() {
      const q = selectedQuestions[currentIdx];
      document.getElementById("progressBar").style.width = (currentIdx / selectedQuestions.length) * 100 + "%";
      document.getElementById("qCount").innerText = `सवाल: ${currentIdx + 1} / ${selectedQuestions.length}`;
      document.getElementById("questionBox").innerHTML = `${q.question} <button class="speak-btn" onclick="readFullQuestion()">🔊</button>`;
      
      document.getElementById("bookmarkActionBtn").classList.toggle("active", savedList.some(item => item.question === q.question));
      
      const oBox = document.getElementById("optionsBox"), rBox = document.getElementById("resultBox"), nBtn = document.getElementById("nextBtn"), eBox = document.getElementById("explanationBox");
      oBox.innerHTML = ""; rBox.innerText = ""; nBtn.style.display = "none"; eBox.style.display = "none"; 
      
      q.options.forEach((opt) => {
        const b = document.createElement("button"); b.className = "option-btn"; b.innerText = opt;
        b.onclick = () => {
          questionsAttempted++;
          document.querySelectorAll(".option-btn").forEach(btn => btn.style.pointerEvents = "none");
          if(opt === q.answer) { 
            score++; rBox.innerHTML = "<span style='color:#27ae60'>✅ सही!</span>"; 
            if(isWeakMode) { weakList = weakList.filter(i => i.question !== q.question); localStorage.setItem("weak_questions", JSON.stringify(weakList)); syncAll(); }
          } else { 
            rBox.innerHTML = `<span style='color:#e74c3c'>❌ गलत! सही: ${q.answer}</span>`; 
            wrongQuestions.push(q); 
            if(!weakList.some(i => i.question === q.question)) { weakList.push(q); localStorage.setItem("weak_questions", JSON.stringify(weakList)); syncAll(); }
          }
          if(q.explanation) { eBox.innerHTML = `<strong>💡 व्याख्या:</strong><br>${q.explanation}`; eBox.style.display = "block"; }
          nBtn.style.display = "block";
        };
        oBox.appendChild(b);
      });
    }

    function handleBookmarkClick() { 
        const q = selectedQuestions[currentIdx];
        const idx = savedList.findIndex(i => i.question === q.question); 
        idx > -1 ? savedList.splice(idx, 1) : savedList.push(q); 
        localStorage.setItem("quiz_bookmarks", JSON.stringify(savedList)); 
        document.getElementById("bookmarkActionBtn").classList.toggle("active");
        checkSavedBtn();
        syncAll(); // Sync to cloud
    }

    function handleHeartClick() {
      const q = selectedQuestions[currentIdx];
      // Note: This needs sub/ch info. For simplicity in sync, Ensure q has sub/ch
      // findMeta logic from your code...
      if(!collections["Manual"]) collections["Manual"] = {};
      if(!collections["Manual"]["Favorites"]) collections["Manual"]["Favorites"] = [];
      const idx = collections["Manual"]["Favorites"].findIndex(i => i.question === q.question);
      idx > -1 ? collections["Manual"]["Favorites"].splice(idx, 1) : collections["Manual"]["Favorites"].push(q);
      localStorage.setItem("quiz_collections", JSON.stringify(collections));
      document.getElementById("heartActionBtn").classList.toggle("active");
      updateCollectionBtn();
      syncAll(); // Sync to cloud
    }

    function nextQuestionTrigger() { currentIdx++; if(currentIdx < selectedQuestions.length) { showQuestion(); } else { showFinalResult(); } }
    
    function showFinalResult() {
      clearInterval(timerInterval);
      document.getElementById("timerDisplay").style.display = "none";
      document.getElementById("quizArea").innerHTML = `<div style="text-align:center;"><h3>🏁 रिजल्ट: ${score}/${selectedQuestions.length}</h3>` + `<button class="main-btn" onclick="goToHome()">🏠 होम</button></div>`;
      syncAll();
    }

    function goToHome() { location.reload(); }
    function startTimer(m) { let t = m * 60; document.getElementById("timerDisplay").style.display = "block"; timerInterval = setInterval(() => { let mins = Math.floor(t/60), secs = t%60; document.getElementById("timerDisplay").innerText = `⏳ ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`; if (--t < 0) { clearInterval(timerInterval); showFinalResult(); } }, 1000); }
    function toggleTheme() { document.body.hasAttribute("data-theme") ? document.body.removeAttribute("data-theme") : document.body.setAttribute("data-theme", "dark"); }
    function checkSavedBtn() { document.getElementById("savedPracticeBtn").style.display = savedList.length > 0 ? "block" : "none"; }
    function updateWeakBtn() { document.getElementById("weakAreasBtn").style.display = (weakList.length > 0) ? "block" : "none"; if(document.getElementById("weakCount")) document.getElementById("weakCount").innerText = weakList.length; }
    function updateCollectionBtn() { document.getElementById("collectionMainBtn").style.display = Object.keys(collections).length > 0 ? "block" : "none"; }
    function checkResumeStatus() { } 
    function clearSession() { }
    function quitQuiz() { if(confirm("क्विज़ छोड़ें?")) showFinalResult(); }
    function speak(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); window.speechSynthesis.speak(u); }
    function readFullQuestion() { const q = selectedQuestions[currentIdx]; speak(q.question); }
  </script>
</body>
</html>
